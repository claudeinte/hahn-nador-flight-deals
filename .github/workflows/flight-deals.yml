name: Flugpreise Hahn – Nador

on:
  # Kein GitHub-"schedule" (wird oft verzögert/ausgelassen): gestartet wird per cron-job.org
  # über die GitHub-API (workflow_dispatch) – oder von Hand unter "Actions".
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options: [automatisch, tagesbeitrag-erzwingen, wochenbeitrag-erzwingen, top3-kombinationen, demo]
        default: automatisch

permissions:
  contents: write

concurrency:
  group: hahn-nador-flight-deals
  cancel-in-progress: false

jobs:
  flugpreise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      # Facebook: Veröffentlichung ist AUS. Erst nach Freigabe in config.toml UND
      # als Repository-Variable FACEBOOK_AUTOPUBLISH=true aktivieren.
      FACEBOOK_AUTOPUBLISH: ${{ vars.FACEBOOK_AUTOPUBLISH }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Preise abfragen und Beiträge erstellen
        run: |
          case "${{ inputs.aktion }}" in
            tagesbeitrag-erzwingen)  python -m flightdeals run --force daily ;;
            wochenbeitrag-erzwingen) python -m flightdeals run --force weekly ;;
            top3-kombinationen)      python -m flightdeals top3 ;;
            demo)                    python -m flightdeals demo ;;
            *)                       python -m flightdeals run ;;
          esac

      - name: Preisverlauf speichern
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/*.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Preisverlauf $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)

      - name: Bilder und Texte als ZIP bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-beitraege-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30
