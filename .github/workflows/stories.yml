name: Tages-Stories (Instagram + Facebook)

# Start: von Hand unter "Actions" oder per cron-job.org (workflow_dispatch über die GitHub-API).
# modus=test → Bilder erstellen, nichts veröffentlichen. modus=veroeffentlichen → 21–22 Stories + Post des Tages auf IG und FB.
# Fallos → la ejecución queda "Failed" y GitHub envía su email (job "aviso"). Sin fallos → ningún email.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "test = nur Bilder erstellen · veroeffentlichen = als Stories posten"
        type: choice
        options: [test, veroeffentlichen]
        default: test

permissions:
  contents: write

concurrency:
  group: tages-stories
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
      TZ: Europe/Berlin
      ANZAHL: "0"           # Anzahl kommt aus output/stories/<datum>/anzahl.txt (21 oder 22)
      LAUF_DIR: ${{ github.workspace }}/output/lauf   # Estado para el email de aviso
    steps:
      # Cada paso tiene un id → el email de aviso (job "aviso") sabe qué paso falló.
      # Regla: si la API de Ryanair falla (output/lauf/api_fehler.json), NO se publica nada.
      - id: checkout
        uses: actions/checkout@v4
        with:
          # Siempre el estado MÁS RECIENTE de la rama (no el commit del inicio): así "Re-run"
          # también ve lo ya publicado y no duplica stories ni el post.
          ref: ${{ github.ref_name }}

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - id: deps
        run: bash scripts/paso.sh deps pip install -r requirements.txt

      - name: Datum (Berlin) und Doppel-Schutz
        id: tag
        run: |
          D=$(date +%F)
          echo "datum=$D" >> "$GITHUB_OUTPUT"
          python - "$D" <<'EOF'
          import json, os, sys, pathlib
          d = sys.argv[1]; p = pathlib.Path("data/stories_veroeffentlicht.json")
          st = json.loads(p.read_text()) if p.exists() else {}
          day = st.get(d, {})
          fertig = bool(day.get("komplett"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fertig={'ja' if fertig else 'nein'}\n")
          print("Heute schon komplett veröffentlicht:" , fertig)
          EOF

      - name: Preise abfragen und Story-Bilder erstellen (21–22)
        id: bilder
        if: steps.tag.outputs.fertig == 'nein'
        run: bash scripts/paso.sh bilder python scripts/vorschau_story_kalender.py --alle

      - name: In JPEG umwandeln
        id: jpeg
        if: steps.tag.outputs.fertig == 'nein' && steps.bilder.outcome == 'success'
        run: bash scripts/paso.sh jpeg python scripts/stories_jpeg.py ${{ steps.tag.outputs.datum }}

      - name: Feed-Beiträge (4:5) erstellen – günstigster Hin- und Rückflug
        id: feed_bilder
        if: ${{ !cancelled() && steps.tag.outcome == 'success' && hashFiles('output/lauf/api_fehler.json') == '' }}
        run: |
          mkdir -p public/${{ steps.tag.outputs.datum }}
          bash scripts/paso.sh feed_bilder python scripts/feed_bestpreis.py --out public/${{ steps.tag.outputs.datum }}

      - name: Feed-Rotation vorbereiten (7-Tage-Kreis, Bilder 4:5 + Texte; nichts wird veröffentlicht)
        id: rotacion
        if: ${{ !cancelled() && steps.feed_bilder.outcome == 'success' }}
        run: bash scripts/paso.sh rotacion bash scripts/rotacion_paso.sh ${{ steps.tag.outputs.datum }}

      - name: Bilder öffentlich bereitstellen (Branch "stories")
        id: subir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !cancelled() && inputs.modus == 'veroeffentlichen' && hashFiles('output/lauf/api_fehler.json') == '' && (steps.jpeg.outcome == 'success' || steps.rotacion.outcome == 'success') }}
        run: |
          D=${{ steps.tag.outputs.datum }}
          W=$(mktemp -d)
          cp -r public/$D "$W/"
          cd "$W"
          git init -q -b stories
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Stories $D"
          # Token por cabecera (no en la URL) → nunca aparece en registros ni en el email
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          bash "$GITHUB_WORKSPACE/scripts/paso.sh" subir git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -qf "https://github.com/${{ github.repository }}.git" stories

      - name: Stories veröffentlichen (jede Story bis zu 3 Versuche)
        id: stories
        if: ${{ !cancelled() && steps.tag.outputs.fertig == 'nein' && steps.jpeg.outcome == 'success' && hashFiles('output/lauf/api_fehler.json') == '' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          STORY_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/stories/${{ steps.tag.outputs.datum }}
          BILDER_ONLINE: ${{ steps.subir.outcome == 'success' && 'ja' || 'no' }}
        run: >
          bash scripts/paso.sh stories python scripts/stories_publish.py --ordner public/${{ steps.tag.outputs.datum }}
          --png-ordner output/stories/${{ steps.tag.outputs.datum }}
          --datum ${{ steps.tag.outputs.datum }} --modus ${{ inputs.modus }} --anzahl $ANZAHL

      - name: Feed-Beiträge veröffentlichen (Schritt des 7-Tage-Kreises; auch wenn eine Story fehlschlägt)
        id: feed
        if: ${{ !cancelled() && steps.rotacion.outcome == 'success' && hashFiles('output/lauf/api_fehler.json') == '' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          STORY_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/stories/${{ steps.tag.outputs.datum }}
          BILDER_ONLINE: ${{ steps.subir.outcome == 'success' && 'ja' || 'no' }}
        run: bash scripts/paso.sh feed python scripts/feed_publish.py --ordner public/${{ steps.tag.outputs.datum }} --modus ${{ inputs.modus }}

      - name: Preisverlauf und Veröffentlichungs-Protokoll speichern (immer)
        id: guardar
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          bash scripts/paso.sh guardar bash scripts/guardar_estado.sh

      - name: Ergebnis aller Schritte für den Email-Bericht festhalten (immer)
        if: always()
        env:
          PASOS: ${{ toJSON(steps) }}
        run: mkdir -p output/lauf && printf '%s' "$PASOS" > output/lauf/pasos.json

      - name: Estado de la ejecución para el aviso (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lauf-estado
          path: output/lauf/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Bilder als ZIP bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories-${{ steps.tag.outputs.datum }}-${{ github.run_number }}
          path: public/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # Job separado: se ejecuta SIEMPRE, aunque el job anterior falle, se cancele o se quede sin tiempo.
  # Sin fallos → no hay aviso. Con fallos → la ejecución queda "Failed" → UN email de GitHub (scripts/lauf_bericht.py).
  aviso:
    needs: stories
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - name: Estado de la ejecución descargar
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lauf-estado
          path: output/lauf/
      # Sin Gmail: si algo falló, este paso termina con error → GitHub envía su propio email de aviso
      # a la cuenta que inició la ejecución. El informe completo queda en la página de la ejecución.
      - name: Aviso (falla solo si algo falló → email de GitHub)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULT: ${{ needs.stories.result }}
        run: python scripts/lauf_bericht.py
